name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish any branch by hand from the Actions tab — useful for
  # putting a work-in-progress story in front of someone before it merges.
  workflow_dispatch:

# NOTE: this file is parked in deploy/ — move it to .github/workflows/deploy.yml
# to activate. See deploy/README.md.

# Allow the workflow to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them, and don't cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Turns Pages on for the repo the first time this runs, so nobody has to
      # go flip the setting by hand.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
